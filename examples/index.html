<!doctype html>
<html lang="ru">
<head>

  <title>Примеры композиций</title>

  <div class="row">
    <figure><img src="01-nakopit-na-otpusk.svg" alt="" /><figcaption>«Как накопить на отпуск…» · 1200×630 · под заголовок</figcaption></figure>
    <figure><img src="02-podkast-o-finansah.svg" alt="" /><figcaption>«Подкаст о личных финансах» · квадрат · со смещением</figcaption></figure>
    <figure><img src="03-kniga-lampa-ruchka.svg" alt="" /><figcaption>«лампа, книга, ручка, фоновые тюльпаны» · вертикаль</figcaption></figure>
  </div>

</html>
