<!doctype html>
<html lang="ru">
<head>

  <title>Примеры композиций</title>

    <figure><img src="02-весенняя-распродажа-цветов.svg" alt="" /><figcaption>«Весенняя распродажа цветов» · квадрат · со смещением</figcaption></figure>
    <figure><img src="03-отпуск-без-телефона.svg" alt="" /><figcaption>«Отпуск без телефона» · 1200×630 · собранно</figcaption></figure>
  </div>

</html>
