<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Превью раскладок (для разработки)</title>
  <style>
    body { font: 12px system-ui; margin: 12px; background: #eee; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    figure { margin: 0; background: #fff; padding: 6px; }
    figure svg { width: 100%; height: 220px; }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script type="module">
    import { autoLayout } from '/src/layout.ts';
    import { compositionSvg } from '/src/render.ts';
    import { pickByNames } from '/src/match/pick.ts';
    const sets = (new URLSearchParams(location.search).get('sets') ?? 'кошелёк, монета|лампа, книга, ручка, фоновые тюльпаны|телефон, наушники, пазл, фоновая папка, фоновая монета').split('|');
    const grid = document.getElementById('grid');
    for (const s of sets) for (const format of ['og', 'square', 'vertical']) for (const layout of ['compact', 'offset', 'title']) {
      const picks = pickByNames(s).picks;
      const { scale, items } = autoLayout(picks, format, layout, 'L');
      const c = { format, layout, size: 'L', schemeId: 'violet', background: 'bg1', scale, items: items.map((it, i) => ({ ...it, uid: i + 1 })) };
      const fig = document.createElement('figure');
      fig.innerHTML = compositionSvg(c).replace(/width="\d+" height="\d+" /, '') + `<figcaption>${s} · ${format} · ${layout}</figcaption>`;
      grid.appendChild(fig);
    }
  </script>
</body>
</html>
